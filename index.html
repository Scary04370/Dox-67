<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scary04370 OSINT Panel</title>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- PARAMÈTRES GLOBAUX "PANEL" --- */
        :root {
            --bg-primary: #0d0d0d;      /* Fond principal très sombre */
            --bg-secondary: #1a1a1a;    /* Fond des cartes */
            --accent: #00ff88;          /* Vert fluo "hacker" */
            --accent-dim: #00cc6a;      /* Vert plus foncé pour hover */
            --text: #e0e0e0;            /* Texte principal */
            --text-muted: #666;         /* Texte secondaire */
            --border: #333;             /* Couleur des bordures */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- CONTENANT PRINCIPAL --- */
        .panel {
            width: 100%;
            max-width: 900px;
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        h2 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- BARRE DE RECHERCHE STYLÉE --- */
        .search-bar {
            background: var(--bg-primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .search-bar input {
            width: 70%;
            padding: 10px 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .search-bar button {
            padding: 0 20px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.3s, transform 0.2s;
        }

        .search-bar button:hover {
            background: var(--accent-dim);
            transform: translateY(-2px);
        }

        /* --- GRILLE DES CARDS --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: box-shadow 0.3s, transform 0.2s;
            border-top: 3px solid var(--accent);
        }

        .card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
        }

        .icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* --- ZONE DE RÉSULTATS --- */
        .output {
            margin-top: 25px;
            padding: 15px;
            background: var(--bg-primary);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            min-height: 40px;
        }

        .output-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .result-item {
            color: #0f0; /* Vert très clair pour le texte */
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* --- BOUTONS D'ACTION DANS LES CARDS --- */
        .card .btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .card .btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2><i class="fas fa-shield-alt"></i> Scary04370 OSINT Panel</h2>
        
        <!-- Barre de recherche -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher un nom, email ou terme...">
            <button onclick="lancerRecherche()">Go</button>
        </div>

        <!-- Grille des cartes -->
        <div class="grid">
            
            <!-- Card 1: Google -->
            <div class="card">
                <div class="icon"><i class="fas fa-search"></i></div>
                <div class="card-title">Google Search</div>
                <button class="btn" onclick="searchGoogle()">Exécuter</button>
            </div>

            <!-- Card 2: Twitter -->
            <div class="card">
                <div class="icon"><i class="fab fa-twitter"></i></div>
                <div class="card-title">Twitter OSINT</div>
                <button class="btn" onclick="twitterOsint()">Exécuter</button>
            </div>

            <!-- Card 3: Email -->
            <div class="card">
                <div class="icon"><i class="fas fa-envelope"></i></div>
                <div class="card-title">Email Lookup</div>
                <button class="btn" onclick="emailLookup()">Exécuter</button>
            </div>

            <!-- Card 4: Phone -->
            <div class="card">
                <div class="icon"><i class="fas fa-phone"></i></div>
                <div class="card-title">Phone Search</div>
                <button class="btn" onclick="phoneSearch()">Exécuter</button>
            </div>

        </div>

        <!-- Zone de résultat -->
        <div class="output" id="resultArea">
            <div class="output-title">Résultats</div>
            <p style="color: var(--text-muted);">Cliquez sur un bouton ci-dessus pour commencer.</p>
        </div>
    </div>

    <script>
        // Fonction pour afficher les résultats dans la zone stylée
        function addResult(text) {
            const area = document.getElementById('resultArea');
            const newDiv = document.createElement('div');
            newDiv.className = 'result-item';
            newDiv.innerHTML = '► ' + text;
            area.appendChild(newDiv);
            // Scroll automatique en bas
            area.scrollTop = area.scrollHeight;
        }

        // --- FONCTIONS DE SIMULATION (Effet "réel") ---

        function searchGoogle() {
            addResult("Effectuation d'une recherche Google...");
            // Simulation d'un délai de réseau
            setTimeout(() => addResult("Résultat : 12 liens trouvés pour la requête."), 800);
        }

        function twitterOsint() {
            addResult("Analyse de profil Twitter en cours...");
            setTimeout(() => addResult("Utilisateur vérifié : @example_user | 5.2k abonnés"), 800);
        }

        function emailLookup() {
            addResult("Vérification de la fuite d'email...");
            setTimeout(() => addResult("Email trouvé dans 1 base de données publique."), 800);
        }

        function phoneSearch() {
            addResult("Recherche numéro dans les annonces...");
            setTimeout(() => addResult("Propriétaire : Inconnu / Opérateur : FreeMobile"), 800);
        }

        // Au chargement, on peut mettre un petit message
        window.onload = () => addResult("Panel initialisé avec succès.");
    </script>

</body>
</html>
